<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — NetSentinel SOC' : 'NetSentinel — Network Anomaly Detection'}">NetSentinel</title>
    <link rel="stylesheet" th:href="@{/css/netsentinel-theme.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2320A99A%22 stroke-width=%222.5%22><path d=%22M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z%22/></svg>">
</head>
<body>

<div class="app-wrapper">
    <!-- Reusable Sidebar -->
    <div th:replace="~{layout/fragments :: appSidebar(${activeTab != null ? activeTab : 'dashboard'})}"></div>

    <!-- Main View Area -->
    <div class="app-main">
        <!-- Reusable Header -->
        <div th:replace="~{layout/fragments :: appHeader(${pageTitle != null ? pageTitle : 'NetSentinel Operations'}, ${pageSub != null ? pageSub : 'Campus Security & Incident Intelligence'})}"></div>

        <!-- Dynamic Body Content -->
        <main class="app-content">
            <!-- Toast notification messages -->
            <div th:if="${successMessage != null}" class="toast success" style="position:static; margin-bottom:1rem;">
                <span th:text="${successMessage}">Success operation</span>
            </div>
            <div th:if="${errorMessage != null}" class="toast error" style="position:static; margin-bottom:1rem;">
                <span th:text="${errorMessage}">Error encountered</span>
            </div>
            <div th:if="${warningMessage != null}" class="toast warning" style="position:static; margin-bottom:1rem;">
                <span th:text="${warningMessage}">Warning notification</span>
            </div>

            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
