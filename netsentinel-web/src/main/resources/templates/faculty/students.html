<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Students — NetSentinel Faculty</title>
    <link rel="stylesheet" th:href="@{/css/netsentinel-theme.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2320A99A%22 stroke-width=%222.5%22><path d=%22M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z%22/></svg>">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{layout/fragments :: appSidebar('students')}"></div>

    <div class="app-main">
        <div th:replace="~{layout/fragments :: appHeader('Enrolled Class Roster', 'Authorized Student Enrollment per Subject')}"></div>

        <main class="app-content">
            <!-- Filter by Course -->
            <div class="filter-bar">
                <span style="font-weight:600; font-size:0.8rem;">Select Course Module:</span>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <a th:each="s : ${assignedSubjects}"
                       th:href="@{/faculty/students(subjectId=${s.subjectId})}"
                       class="btn btn-sm"
                       th:classappend="${selectedSubjectId == s.subjectId ? 'btn-primary' : 'btn-outline'}"
                       th:text="${s.subjectCode + ' - ' + s.subjectName}">
                        CS301
                    </a>
                </div>
            </div>

            <!-- Student Roster Table -->
            <div class="panel-card">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">Enrolled Students</h2>
                        <span class="panel-subtitle">Legitimate student profiles eligible for attendance and grading</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Student Name</th>
                                <th>Course</th>
                                <th>Term</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${enrolledStudents == null or enrolledStudents.empty}">
                                <td colspan="6" style="text-align:center; color:var(--text-muted); padding:2rem;">No students enrolled or select a subject above.</td>
                            </tr>
                            <tr th:each="st : ${enrolledStudents}">
                                <td><span class="code-badge" th:text="${st.studentUserCode}">STU-2026-042</span></td>
                                <td style="font-weight:600;" th:text="${st.studentName}">Rahul Sharma</td>
                                <td><span class="code-badge" th:text="${st.subjectCode}">CS301</span></td>
                                <td th:text="${st.semester}">Fall 2026</td>
                                <td><span class="badge badge-success" th:text="${st.enrollmentStatus}">ENROLLED</span></td>
                                <td>
                                    <div style="display:flex; gap:0.4rem;">
                                        <a th:href="@{/faculty/attendance(subjectId=${st.subjectId})}" class="btn btn-outline btn-sm">Take Attendance</a>
                                        <a th:href="@{/faculty/marks(subjectId=${st.subjectId})}" class="btn btn-primary btn-sm">Assign Mark</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
